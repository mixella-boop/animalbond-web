<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8A65"/>
      <stop offset="50%" style="stop-color:#FF5252"/>
      <stop offset="100%" style="stop-color:#E91E63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
    <filter id="softshadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- Fundal -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Highlight subtil sus-stanga -->
  <ellipse cx="350" cy="250" rx="280" ry="180" fill="white" opacity="0.07"/>

  <!-- INIMĂ albă cu umbra -->
  <g filter="url(#shadow)">
    <path d="M512 730
             C490 710 240 570 240 390
             C240 295 310 225 400 225
             C452 225 498 252 512 278
             C526 252 572 225 624 225
             C714 225 784 295 784 390
             C784 570 534 710 512 730Z"
          fill="white"/>
  </g>

  <!-- LĂBUȚĂ roz în inimă -->
  <!-- Corp principal labă -->
  <ellipse cx="512" cy="520" rx="72" ry="62" fill="#FF5252" opacity="0.45"/>

  <!-- 4 degețele -->
  <ellipse cx="420" cy="478" rx="40" ry="35" fill="#FF5252" opacity="0.42"/>
  <ellipse cx="604" cy="478" rx="40" ry="35" fill="#FF5252" opacity="0.42"/>
  <ellipse cx="373" cy="410" rx="30" ry="27" fill="#FF5252" opacity="0.38"/>
  <ellipse cx="651" cy="410" rx="30" ry="27" fill="#FF5252" opacity="0.38"/>

  <!-- Linie separator subtilă -->
  <rect x="180" y="760" width="664" height="3" rx="2" fill="white" opacity="0.25"/>

  <!-- Text ANIMAL -->
  <text x="512" y="840"
        font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif"
        font-size="88"
        font-weight="900"
        fill="white"
        text-anchor="middle"
        letter-spacing="6"
        opacity="0.97">ANIMAL</text>

  <!-- Text BOND — mai mic, diferit weight pentru contrast -->
  <text x="512" y="930"
        font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif"
        font-size="72"
        font-weight="900"
        fill="white"
        text-anchor="middle"
        letter-spacing="16"
        opacity="0.80">BOND</text>

  <!-- Puncte decorative mici -->
  <circle cx="295" cy="870" r="8" fill="white" opacity="0.3"/>
  <circle cx="729" cy="870" r="8" fill="white" opacity="0.3"/>
</svg>
